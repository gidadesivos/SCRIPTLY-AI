# =========================================================================
# Publicar no Supabase pelo GitHub, sem terminal.
#
# Aba "Actions" do repositório -> "Supabase" -> botão "Run workflow".
#
# É disparo MANUAL de propósito. Publicar function e aplicar migration
# mexem no banco de produção; amarrar isso a todo "git push" faria um
# commit qualquer alterar o ambiente que os usuários estão usando.
# =========================================================================
name: Supabase

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Projeto de destino (deixe em branco para o atual)'
        type: string
        default: ''
      publicar_funcoes:
        description: 'Publicar as Edge Functions (ai-generate e link-preview)'
        type: boolean
        default: true
      diagnosticar:
        description: 'Só diagnosticar: mostrar a que contas e projetos o token dá acesso'
        type: boolean
        default: false
      migrations:
        description: 'O que fazer com as migrations pendentes'
        type: choice
        default: nao
        options:
          - nao
          - simular
          - aplicar

env:
  # Projeto atual. A entrada project_ref sobrepõe, para apontar a execução a
  # outro projeto sem editar este arquivo — é o que permite migrar de conta
  # sem commit.
  PROJECT_REF: ${{ inputs.project_ref != '' && inputs.project_ref || 'hsncbjxsbbtcpdmvbptc' }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Um 403 "sem privilégio" tem duas causas muito diferentes: o token é de
      # OUTRA conta (o projeto não aparece na lista) ou a conta está na
      # organização com papel insuficiente (o projeto aparece, mas escrever é
      # negado). Listar separa as duas em vez de chutar.
      - name: Diagnosticar acesso do token
        if: ${{ inputs.diagnosticar }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "::group::Organizações que o token enxerga"
          supabase orgs list || echo "FALHOU ao listar organizações"
          echo "::endgroup::"
          echo "::group::Projetos que o token enxerga"
          supabase projects list || echo "FALHOU ao listar projetos"
          echo "::endgroup::"

      # As functions não precisam da senha do banco: só do token da conta.
      - name: Publicar Edge Functions
        if: ${{ inputs.publicar_funcoes }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ai-generate --project-ref "$PROJECT_REF"
          supabase functions deploy link-preview --project-ref "$PROJECT_REF"

      # Daqui para baixo entra a senha do banco, porque conecta no Postgres.
      - name: Conectar ao projeto
        if: ${{ inputs.migrations != 'nao' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"

      # "simular" existe porque db push aplica TUDO que a tabela de histórico
      # do remoto não registra. Se alguma migration antiga foi aplicada por
      # fora, ele tenta recriar o que já existe e o banco de produção fica no
      # meio do caminho. Ver a lista antes é barato; desfazer meia migration
      # em produção não é.
      - name: Conferir sem aplicar
        if: ${{ inputs.migrations != 'nao' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::group::Histórico local x remoto"
          supabase migration list --linked
          echo "::endgroup::"
          echo "::group::O que seria aplicado"
          supabase db push --linked --dry-run
          echo "::endgroup::"

      - name: Aplicar migrations
        if: ${{ inputs.migrations == 'aplicar' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked
