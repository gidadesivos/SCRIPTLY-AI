# =========================================================================
# Publicar no Supabase pelo GitHub, sem terminal.
#
# Aba "Actions" do repositório -> "Supabase" -> botão "Run workflow".
#
# É disparo MANUAL de propósito. Publicar function e aplicar migration
# mexem no banco de produção; amarrar isso a todo "git push" faria um
# commit qualquer alterar o ambiente que os usuários estão usando.
# =========================================================================
name: Supabase

on:
  workflow_dispatch:
    inputs:
      publicar_funcoes:
        description: 'Publicar as Edge Functions (ai-generate e link-preview)'
        type: boolean
        default: true
      migrations:
        description: 'O que fazer com as migrations pendentes'
        type: choice
        default: nao
        options:
          - nao
          - simular
          - aplicar

env:
  PROJECT_REF: hsncbjxsbbtcpdmvbptc

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # As functions não precisam da senha do banco: só do token da conta.
      - name: Publicar Edge Functions
        if: ${{ inputs.publicar_funcoes }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ai-generate --project-ref "$PROJECT_REF"
          supabase functions deploy link-preview --project-ref "$PROJECT_REF"

      # Daqui para baixo entra a senha do banco, porque conecta no Postgres.
      - name: Conectar ao projeto
        if: ${{ inputs.migrations != 'nao' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"

      # "simular" existe porque db push aplica TUDO que a tabela de histórico
      # do remoto não registra. Se alguma migration antiga foi aplicada por
      # fora, ele tenta recriar o que já existe e o banco de produção fica no
      # meio do caminho. Ver a lista antes é barato; desfazer meia migration
      # em produção não é.
      - name: Conferir sem aplicar
        if: ${{ inputs.migrations != 'nao' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "::group::Histórico local x remoto"
          supabase migration list --linked
          echo "::endgroup::"
          echo "::group::O que seria aplicado"
          supabase db push --linked --dry-run
          echo "::endgroup::"

      - name: Aplicar migrations
        if: ${{ inputs.migrations == 'aplicar' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked
